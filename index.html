<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            text-decoration: none;
            background: #333;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ivan Brice Ponpon </h1>
        <p>Section: BSIT1 SOUTH 8</p>

        <!-- Replace 'portfolio.pdf' with your file or link -->
        <a href="Ponpon_Ivan_Portfolio.pdf" target="_blank" class="btn">
            View My Portfolio
        </a>
    </div>

</body>
</html>
